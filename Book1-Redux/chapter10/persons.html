<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List of Persons</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/redux/4.2.1/redux.min.js"></script>
  </head>
  <body>
    <script>
      // Creating Action Objects

      function addPerson(id, name, age) {
        return {
          type: "ADD",
          personData: {
            id: id,
            name: name,
            age: age,
          },
        };
      }
      function removePerson(id) {
        return {
          type: "REMOVE",
          personId: id,
        };
      }

      //   Define Reducer Function

      const initialState = {
        persons: [],
      };

      function reducer(state, action) {
        if (state === undefined) {
          state = initialState;
        }
        if (action.type === "ADD") {
          const newPerson = {
            id: action.personData.id,
            name: action.personData.name,
            age: action.personData.age,
          };
          return {
            ...state,
            persons: state.persons.concat(newPerson),
          };
        } else if (action.type === "REMOVE") {
          return {
            ...state,
            persons: state.persons.filter(
              (person) => person.id !== action.personId,
            ),
          };
        } else {
          return state;
        }
      }

      const store = Redux.createStore(reducer);

      store.subscribe(showState);

      function showState() {
        console.log(store.getState());
      }

      store.dispatch(addPerson(1, "Greg", 5));
      store.dispatch(addPerson(2, "Carol", 3));
      store.dispatch(addPerson(3, "Gabriel", 6));
      store.dispatch(addPerson(4, "Fred", 8));
      store.dispatch(removePerson(4));
    </script>
  </body>
</html>

<!-- Purpose
Demonstrates Redux for managing a simple list of persons with add and remove actions in plain JavaScript.

Core Functionality

Action Creators: Functions to create actions for adding or removing persons.

Reducer: Handles "ADD" and "REMOVE" actions, updating the persons array accordingly.

Store: Created via Redux.createStore(reducer) and logs state changes to the console.

Usage
Dispatching actions modifies the state.

Output
Logs the current state of persons array in the console whenever an action is dispatched. -->
